{% extends "base.html" %}

{% block body %}
<main class="gate">
  {% include "_dial.html" %}

  <header class="gate-head rise">
    <span class="wordmark">StudyVault</span>
  </header>

  <section class="gate-statement">
    <h1 class="display rise" style="--i:2">{% block statement %}{% endblock %}</h1>
    <p class="rise" style="--i:4">{% block lede %}{% endblock %}</p>
  </section>

  <section class="gate-form rise" style="--i:6">
    {% block form %}{% endblock %}
  </section>

  <footer class="gate-foot rise" style="--i:8">
    <span class="eyebrow"><span>Arquivo pessoal de estudos</span></span>
    <span class="eyebrow"><span>Markdown</span><span>Código</span><span>Imagens</span></span>
  </footer>
</main>
{% endblock %}
